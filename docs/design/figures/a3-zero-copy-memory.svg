<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="660" viewBox="0 0 1280 660" font-family="Inter, system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="a3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
    <marker id="a3r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#ef4444"/>
    </marker>
  </defs>
  <rect width="1280" height="660" fill="#ffffff"/>
  <rect x="0" y="0" width="1280" height="8" fill="#1e3a5f"/>
  <text x="36" y="46" font-size="28" font-weight="800" fill="#0f172a">Zero-Copy Memory Layout</text>

  <!-- ════ LEFT — copy ════ -->
  <rect x="40" y="82" width="560" height="510" rx="14" fill="#fef2f2" stroke="#fecaca"/>
  <text x="320" y="118" font-size="20" font-weight="800" fill="#b91c1c" text-anchor="middle">Conventional — Copy</text>

  <rect x="80" y="150" width="190" height="80" rx="10" fill="#ffffff" stroke="#fca5a5"/>
  <text x="175" y="210" font-size="16" font-weight="800" fill="#0f172a" text-anchor="middle">DataFrame</text>
  <line x1="270" y1="190" x2="330" y2="190" stroke="#ef4444" stroke-width="3" marker-end="url(#a3r)"/>
  <text x="300" y="178" font-size="15" font-weight="800" fill="#b91c1c" text-anchor="middle">copy</text>
  <rect x="332" y="150" width="190" height="80" rx="10" fill="#ffffff" stroke="#fca5a5"/>
  <text x="427" y="210" font-size="16" font-weight="800" fill="#0f172a" text-anchor="middle">Tensor</text>

  <text x="320" y="300" font-size="15" font-weight="700" fill="#b91c1c" text-anchor="middle">duplicate buffer · re-alloc</text>
  <text x="320" y="324" font-size="13" fill="#64748b" text-anchor="middle">every element re-written</text>

  <rect x="100" y="360" width="440" height="44" rx="8" fill="#fecaca"/>
  <rect x="100" y="360" width="300" height="44" rx="8" fill="#ef4444"/>
  <text x="118" y="390" font-size="17" font-weight="800" fill="#ffffff">2× memory</text>

  <text x="320" y="452" font-size="13" fill="#64748b" text-anchor="middle">higher peak RSS at scale</text>

  <!-- ════ RIGHT — zero-copy ════ -->
  <rect x="680" y="82" width="560" height="510" rx="14" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="960" y="118" font-size="20" font-weight="800" fill="#166534" text-anchor="middle">Xazz — Arrow Zero-Copy</text>

  <rect x="700" y="150" width="180" height="80" rx="10" fill="#ffffff" stroke="#86efac"/>
  <text x="790" y="210" font-size="16" font-weight="800" fill="#0f172a" text-anchor="middle">LazyFrame</text>
  <line x1="880" y1="190" x2="900" y2="190" stroke="#22c55e" stroke-width="3" marker-end="url(#a3)"/>

  <rect x="902" y="120" width="310" height="140" rx="12" fill="#fdf4ff" stroke="#d8b4fe"/>
  <text x="1057" y="160" font-size="18" font-weight="800" fill="#6b21a8" text-anchor="middle">Shared Buffer</text>
  <text x="1057" y="190" font-size="14" fill="#7e22ce" text-anchor="middle">single copy · zero dupe</text>
  <text x="1057" y="216" font-size="13" fill="#7e22ce" text-anchor="middle">Arrow memory-mapped</text>

  <line x1="1057" y1="260" x2="1057" y2="292" stroke="#22c55e" stroke-width="3" marker-end="url(#a3)"/>
  <text x="1069" y="282" font-size="14" font-weight="800" fill="#15803d">zero-copy</text>

  <rect x="950" y="300" width="220" height="70" rx="10" fill="#ffffff" stroke="#d8b4fe"/>
  <text x="1060" y="345" font-size="16" font-weight="800" fill="#6b21a8" text-anchor="middle">Tensor</text>

  <rect x="780" y="410" width="360" height="44" rx="8" fill="#bbf7d0"/>
  <rect x="780" y="410" width="180" height="44" rx="8" fill="#22c55e"/>
  <text x="798" y="440" font-size="17" font-weight="800" fill="#14532d">1× memory</text>

  <text x="960" y="502" font-size="13" fill="#64748b" text-anchor="middle">half the footprint of copy</text>

  <line x1="640" y1="82" x2="640" y2="592" stroke="#cbd5e1" stroke-width="2.5" stroke-dasharray="6 6"/>
</svg>