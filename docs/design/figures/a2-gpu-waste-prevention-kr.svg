  <line x1="320" y1="212" x2="320" y2="238" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#a2k)"/>

  <rect x="66" y="242" width="508" height="62" rx="10" fill="#ffffff" stroke="#fca5a5"/>
  <text x="86" y="282" font-size="17" font-weight="700" fill="#111827">학습 중단 · GPU 사이클 손실</text>
  <line x1="320" y1="304" x2="320" y2="330" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#a2k)"/>

  <rect x="66" y="334" width="508" height="62" rx="10" fill="#ffffff" stroke="#fca5a5"/>
  <text x="86" y="374" font-size="17" font-weight="700" fill="#111827">재할당 · 재실행 · 반복</text>

  <path d="M 574 366 q 32 0 32 -120 q 0 -30 -30 -30 h -26" fill="none" stroke="#ef4444" stroke-width="2.5" marker-end="url(#a2k)"/>
  <text x="592" y="270" font-size="13" font-weight="800" fill="#b91c1c">반복</text>

  <text x="320" y="450" font-size="15" font-weight="800" fill="#b91c1c" text-anchor="middle">실패 반복으로 GPU 낭비</text>
  <text x="320" y="474" font-size="12.5" fill="#64748b" text-anchor="middle">타입·NaN 오류는 실행 중에만 발견</text>

  <!-- ════ RIGHT — Xazz ════ -->
  <rect x="680" y="92" width="560" height="466" rx="14" fill="#f0fdf4" stroke="#bbf7d0"/>
