[package]
name = "xazz-exec"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Xazz execution engine — Polars LazyFrame runtime for .xzz pipeline scripts. Heavy dependencies (Polars, encoding_rs) are isolated here."
keywords = ["data", "pipeline", "polars", "runtime", "csv"]
categories = ["science"]

# ── 실행 바이너리 (xazz-runner가 서브프로세스로 스폰) ─────────────────────────
[[bin]]
name = "xazz-exec"
path = "src/main.rs"

# ── 선택적 ML 컴퓨트 백엔드 (D1 #62 · D2 #63 · F4 #73) ────────────────────────
# CPU(burn-ndarray)는 항상 컴파일되며, 사용할 수 없는 백엔드의 폴백이다.
# 아래 feature 는 해당 하드웨어/SDK가 있는 호스트에서만 켠다. 각 백엔드의
# 실기 acceptance 테스트는 `#[ignore]` 로 게이트되어 있다
# (`cargo test -p xazz-exec --features cuda -- --ignored`).
#
# ⚠️  Windows 에서 `onnx*` 는 MSVC 툴체인 전용이다. ONNX Runtime 은 windows-gnu
#     prebuilt 가 없어 GNU 툴체인으로는 빌드되지 않는다(build.rs 가 사전 차단).
#     `rustup default stable-x86_64-pc-windows-msvc` + VS Build Tools
#     ("Desktop development with C++")가 필요하다.
#     `cuda`(burn-cuda)는 순수 Rust/CubeCL 이라 MSVC 요구가 없다.
#     참고: docs/design/gpu-backend-acceptance.md §4-§6.
[features]
default = []
cuda = ["dep:burn-cuda"]
wgpu = ["dep:burn-wgpu"]
onnx = ["dep:ort", "dep:rlx-onnx-proto", "dep:protobuf"]
# ONNX GPU execution providers (D2). Each enables the matching `ort` feature, so
# `ort`'s `download-binaries` fetches a GPU-enabled ONNX Runtime (Windows:
# cuda13+tensorrt+nvrtx+directml, macOS: coreml) instead of the CPU build.
# Runtime EP selection is `XAZZ_ORT_EP` (see backend.rs / onnx_export.rs).
onnx-cuda = ["onnx", "ort/cuda"]
onnx-tensorrt = ["onnx", "ort/tensorrt"]
onnx-directml = ["onnx", "ort/directml"]
onnx-coreml = ["onnx", "ort/coreml"]

[dependencies]
# 공유 핵심 타입
xazz-core     = { path = "../xazz-core" }
# 컴파일러 (Lexer/Parser/Codegen) — Polars 없음
xazz-compiler = { path = "../xazz-compiler" }

# ── 무거운 런타임 의존성 (CLI 바이너리에 절대 포함되면 안 됨) ─────────────────
# `parquet`/`ipc` features: out-of-core columnar sources + save() artifacts (issue #52)
polars = { version = "0.53", features = ["lazy", "csv", "strings", "regex", "parquet", "ipc"] }

# 한국 공공데이터 EUC-KR → UTF-8 디코딩
encoding_rs = "0.8"

serde      = { version = "1", features = ["derive"] }
serde_json = "1"

# ── Burn 딥러닝 엔진 (v0.4) ─────────────────────────────────────────────────
# CPU 백엔드(ndarray)는 순수 Rust로 빌드되어 CI/로컬 어디서든 동작한다.
# GPU 백엔드로 전환 시 아래 두 줄만 교체하면 된다:
#   burn-cuda  = { version = "0.21" }   (CUDA/CubeCL)
#   burn-wgpu  = { version = "0.21" }   (WebGPU/GPU 필요)
burn = { version = "0.21", default-features = false, features = ["std", "autodiff"] }
burn-ndarray = { version = "0.21", default-features = false, features = ["std", "burn-autodiff"] }

# WebGPU provider (D1 #62) — pure-Rust GPU backend, enabled by the `wgpu` feature.
# It needs no external SDK (unlike libtorch/onnxruntime); a Vulkan/Metal/DX12
# device is probed at runtime, and a missing device falls back to CPU through the
# resolver's warning path.
burn-wgpu = { version = "0.21", optional = true }

# CUDA provider (D1 #62, revised) — native CubeCL CUDA backend, enabled by the
# `cuda` feature. Unlike the former burn-tch/LibTorch path this is pure Rust
# (CubeCL JIT-compiles kernels at runtime), has no LibTorch/system-SDK or MSVC
# requirement, and shares the CubeCL stack with burn-wgpu — so it tracks the
# upstream Burn 0.22 direction (CubeCL CUDA, graph replay, LLVM GPU backends).
# A CUDA driver must be present at runtime; a missing device falls back to CPU
# through the resolver's probe/warning path.
burn-cuda = { version = "0.21", optional = true }

# ONNX provider (D2 #63) — export + inference, enabled by the `onnx` feature.
# `ort` is the ONNX Runtime binding (its `download-binaries` default fetches a
# prebuilt runtime, so no system install is required); `rlx-onnx-proto` provides
# the ONNX protobuf types without a build-time `protoc`, and `protobuf` is its
# serialization trait. `tls-rustls` is used instead of the default `tls-native`
# so the download needs no system OpenSSL (`openssl-sys`).
# Windows: MSVC toolchain only (`ort-sys` has no windows-gnu prebuilt).
ort = { version = "2.0.0-rc.13", default-features = false, features = [
    "std",
    "download-binaries",
    "copy-dylibs",
    "api-27",
    "tls-rustls",
], optional = true }
rlx-onnx-proto = { version = "0.2", optional = true }
protobuf = { version = "3.7", optional = true }

# ── DuckDB 외부 소스 커넥터 (issue #56, Track A3) ─────────────────────────────
# bundled: embeds DuckDB (no system install needed).
# The `polars` feature is enabled only to keep libduckdb-sys at the hash that
# builds cleanly under the zig C++ wrapper on this toolchain; we never call
# query_polars (results cross via Parquet), so the extra polars 0.49 does not
# enter the type surface.
duckdb = { version = "1.10505", features = ["bundled"] }
postgres = "0.19.14"
