  <text x="726" y="374" font-size="17" font-weight="700" fill="#111827">단일 실행 · 재실행 없음</text>

  <text x="960" y="450" font-size="15" font-weight="800" fill="#166534" text-anchor="middle">근원에서 낭비 제거</text>
  <text x="960" y="474" font-size="12.5" fill="#64748b" text-anchor="middle">GPU 비용 발생 전에 오류 차단</text>

  <line x1="640" y1="92" x2="640" y2="558" stroke="#cbd5e1" stroke-width="2.5" stroke-dasharray="6 6"/>
