name: CI

on:
  push:
    branches: ["main", "dev"]
  pull_request:
    branches: ["main", "dev"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust stable
        shell: bash
        run: |
          rustup toolchain install stable --no-self-update --profile minimal --component rustfmt --component clippy
          rustup default stable

      - name: Cache Cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: registry-${{ matrix.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: registry-${{ matrix.os }}-

      - name: Cache build artifacts
        uses: actions/cache@v6
        with:
          path: target
          key: build-test-${{ matrix.os }}-${{ hashFiles('**/Cargo.lock') }}-${{ hashFiles('src/**/*.rs', 'xazz-*/src/**/*.rs') }}
          restore-keys: |
            build-test-${{ matrix.os }}-${{ hashFiles('**/Cargo.lock') }}-
            build-test-${{ matrix.os }}-

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy
        # 워크스페이스가 clippy clean이므로 경고도 실패로 처리한다.
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace

  # ── 프런트엔드 (Visual IDE) — Vite 빌드 + 컨트랙트/stdout/대비/E2E 테스트 ─────
  frontend:
    name: Frontend · Visual IDE
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: visual-ide

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: visual-ide/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Contract tests
        run: npm run test:contract

      - name: Stdout marker parser tests
        run: npm run test:stdout

      - name: Contrast tests
        run: |
          npx playwright install --with-deps chromium
          npm run test:contrast

      # 브라우저는 위 단계에서 이미 설치됐다. playwright.config.mjs 의 webServer 가
      # 빌드와 preview 를 띄우고, 서버 응답은 테스트가 page.route 로 대신한다.
      - name: E2E tests
        run: npm run test:e2e

      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-test-results
          path: visual-ide/test-results/
          retention-days: 7

  # ── 라이선스 · 의존성 정책 (deny.toml) ──────────────────────────────────────
  licenses:
    name: License & dependency policy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: cargo-deny (licenses · bans · sources · advisories)
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          arguments: --all-features
          manifest-path: ./Cargo.toml
