[workspace]

members = [
  "xazz-core",
  "xazz-compiler",
  "xazz-runner",
  "xazz-exec",
  "xazz-server"
]
resolver = "2"



[workspace.package]
version = "0.3.0"
edition = "2024"
authors = ["Jangseowoo <ax1s.xazz.com>"]
license = "Apache-2.0"
repository = "https://github.com/x1zzdev/Xazz"

# ── 루트 패키지 (Xazz CLI 바이너리) ─────────────────────────────────────────────
[package]
name = "xazz"
version = {workspace = true}
edition = "2024"
authors = ["Jangseowoo <ax1s.xazz.com>"]
license = "Apache-2.0"
description = "Xazz — scripting on the surface, compiled at its core. A data pipeline language that compiles .xzz scripts into optimized Polars LazyFrame execution plans."
keywords = ["data", "pipeline", "polars", "compiler", "csv"]
categories = ["command-line-utilities", "compilers", "science"]
repository = "https://github.com/x1zzdev/Xazz"
readme = "README.md"

exclude = [
    "benches/**",
    "examples/**/*.csv",
    "examples/**/*.png",
    "examples/**/*.html",
    "cli_integration/**",
    "test/**",
    "__pycache__/**",
    "*.py",
    "core_code.zip",
]

[[bin]]
name = "xazz"
path = "src/main.rs"

[profile.release]
opt-level     = 3
lto           = true
codegen-units = 1

# ── CLI 의존성 (경량 — Polars/Tokio 없음) ────────────────────────────────────
[dependencies]
# 컴파일러 (Lexer/Parser/Codegen/Emitter) — Polars 없음
# `emit` 명령어에서 emit_rust() 호출에 필요
xazz-compiler = { path = "xazz-compiler" }

# CLI 인자 파싱
clap = { version = "4.4", features = ["derive", "cargo"] }

# UX 헬퍼
indicatif = { version = "0.17" }
colored   = { version = "2.1" }

# 직렬화
serde      = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0" }

# `import` 명령어 전용 (CSV 스키마 추론)
csv         = { version = "1.3" }
anyhow      = { version = "1.0" }
encoding_rs = { version = "0.8" }

# ⚠️  REMOVED: tokio — run 명령어는 xazz-runner 서브프로세스로 위임
# ⚠️  REMOVED: xazz-exec / Polars — CLI 바이너리에 절대 포함되지 않음