# Xazz server + Visual IDE (issue #66, E2 · #176)
#
#   docker compose up
#   open http://127.0.0.1:8005
#
# Uses a Docker-managed volume for writable data and the seeded sample.
# Existing ./data users: migrate before the first up (docs/DOCKER.md).
# See docs/DOCKER.md for host bind-mount permissions and the full port/volume table.
services:
  xazz:
    build:
      context: .
      dockerfile: Dockerfile
    image: xazz:local
    ports:
      - "8005:8005"
    volumes:
      - xazz-data:/data
    environment:
      # Uncomment to require a bearer token on every request:
      # XAZZ_SERVER_TOKEN: "change-me"
      # Uncomment for multi-tenant mode (tenant=token pairs):
      # XAZZ_TENANT_TOKENS: "acme=tok-a,globex=tok-b"
      XAZZ_BIND: "0.0.0.0:8005"
      XAZZ_WEB_DIR: "/app/web"
    restart: unless-stopped
volumes:
  xazz-data:
