# Generate a CycloneDX SBOM and commit it — issue #145.
#
# The authoritative dependency lists are Cargo.lock and
# visual-ide/package-lock.json. Syft reads both and writes one CycloneDX
# document. The job runs when either lockfile changes, and commits the result to
# main so the SBOM in the repo matches the lockfiles.

name: SBOM

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - ci/sbom
    paths:
      - "Cargo.lock"
      - "visual-ide/package-lock.json"
      - ".github/workflows/sbom.yml"

permissions:
  contents: write

jobs:
  sbom:
    name: Generate and commit CycloneDX SBOM
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Prepare output directory
        run: mkdir -p sbom

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          output-file: sbom/xazz.cdx.json
          upload-artifact: false
          dependency-snapshot: false

      - name: Commit if changed
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sbom/xazz.cdx.json
          if git diff --cached --quiet; then
            echo "SBOM is unchanged"
            exit 0
          fi
          git commit -m "chore(sbom): refresh CycloneDX SBOM [skip ci]"
          git push origin main

      - name: Summary
        run: |
          echo "### CycloneDX SBOM" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "components: $(python3 -c "import json;print(len(json.load(open('sbom/xazz.cdx.json')).get('components',[])))")" >> "$GITHUB_STEP_SUMMARY"
