  <text x="36" y="68" font-size="13" fill="#64748b">컴파일 시점에 오류를 찾으면 GPU는 실패할 작업을 아예 시작하지 않는다</text>

  <!-- ════ LEFT — Python ════ -->
  <rect x="40" y="92" width="560" height="466" rx="14" fill="#fef2f2" stroke="#fecaca"/>
