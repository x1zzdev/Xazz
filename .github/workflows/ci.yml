name: CI

on:
  push:
    branches: ["main", "dev"]
  pull_request:
    branches: ["main", "dev"]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        shell: bash
        run: |
          rustup toolchain install stable --no-self-update --profile minimal --component rustfmt --component clippy
          rustup default stable

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: registry-${{ matrix.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: registry-${{ matrix.os }}-

      - name: Cache build artifacts
        uses: actions/cache@v4
        with:
          path: target
          key: build-test-${{ matrix.os }}-${{ hashFiles('**/Cargo.lock') }}-${{ hashFiles('src/**/*.rs', 'xazz-*/src/**/*.rs') }}
          restore-keys: |
            build-test-${{ matrix.os }}-${{ hashFiles('**/Cargo.lock') }}-
            build-test-${{ matrix.os }}-

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy
        # -D warnings 로 린트 실패를 CI 실패로 강제한다.
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace

  # ── 프런트엔드 (Visual IDE) — Vite 빌드 + 컨트랙트/대비 테스트 ───────────────
  frontend:
    name: Frontend · Visual IDE
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: visual-ide

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: visual-ide/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Contract tests
        run: npm run test:contract

      - name: Contrast tests
        run: |
          npx playwright install --with-deps chromium
          npm run test:contrast
