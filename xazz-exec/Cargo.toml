[package]
name = "xazz-exec"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Xazz execution engine — Polars LazyFrame runtime for .xzz pipeline scripts. Heavy dependencies (Polars, encoding_rs) are isolated here."
keywords = ["data", "pipeline", "polars", "runtime", "csv"]
categories = ["science"]

# ── 실행 바이너리 (xazz-runner가 서브프로세스로 스폰) ─────────────────────────
[[bin]]
name = "xazz-exec"
path = "src/main.rs"

# ── 선택적 ML 컴퓨트 백엔드 (D1 #62 · D2 #63 · F4 #73) ────────────────────────
# CPU(burn-ndarray)는 항상 컴파일되며, 사용할 수 없는 백엔드의 폴백이다.
# 아래 feature 는 해당 하드웨어/SDK가 있는 호스트에서만 켠다. 각 백엔드의
# 실기 acceptance 테스트는 `#[ignore]` 로 게이트되어 있다
# (`cargo test -p xazz-exec --features cuda -- --ignored`).
[features]
default = []
cuda = []
wgpu = []
onnx = []

[dependencies]
# 공유 핵심 타입
xazz-core     = { path = "../xazz-core" }
# 컴파일러 (Lexer/Parser/Codegen) — Polars 없음
xazz-compiler = { path = "../xazz-compiler" }

# ── 무거운 런타임 의존성 (CLI 바이너리에 절대 포함되면 안 됨) ─────────────────
# `parquet`/`ipc` features: out-of-core columnar sources + save() artifacts (issue #52)
polars = { version = "0.53", features = ["lazy", "csv", "strings", "regex", "parquet", "ipc"] }

# 한국 공공데이터 EUC-KR → UTF-8 디코딩
encoding_rs = "0.8"

serde      = { version = "1", features = ["derive"] }
serde_json = "1"

# ── Burn 딥러닝 엔진 (v0.4) ─────────────────────────────────────────────────
# CPU 백엔드(ndarray)는 순수 Rust로 빌드되어 CI/로컬 어디서든 동작한다.
# GPU 백엔드로 전환 시 아래 두 줄만 교체하면 된다:
#   burn-tch   = { version = "0.21" }   (libtorch 필요)
#   burn-wgpu  = { version = "0.21" }   (WebGPU/GPU 필요)
burn = { version = "0.21", default-features = false, features = ["std", "autodiff"] }
burn-ndarray = { version = "0.21", default-features = false, features = ["std", "burn-autodiff"] }

# ── DuckDB 외부 소스 커넥터 (issue #56, Track A3) ─────────────────────────────
# bundled: embeds DuckDB (no system install needed).
# The `polars` feature is enabled only to keep libduckdb-sys at the hash that
# builds cleanly under the zig C++ wrapper on this toolchain; we never call
# query_polars (results cross via Parquet), so the extra polars 0.49 does not
# enter the type surface.
duckdb = { version = "1.10505", features = ["bundled"] }
postgres = "0.19.14"
