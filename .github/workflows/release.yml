name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build · ${{ matrix.platform.name }}
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name:    windows-x64
            runner:  windows-latest
            target:  x86_64-pc-windows-msvc

          - name:    linux-x64
            runner:  ubuntu-latest
            target:  x86_64-unknown-linux-gnu



          - name:    macos-arm64
            runner:  macos-latest
            target:  aarch64-apple-darwin

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust stable
        shell: bash
        run: |
          rustup toolchain install stable --no-self-update --profile minimal
          rustup default stable
          rustup target add ${{ matrix.platform.target }}

      - name: Cache Cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: registry-${{ matrix.platform.target }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: registry-${{ matrix.platform.target }}-

      - name: Cache build artifacts
        uses: actions/cache@v6
        with:
          path: target
          key: build-${{ matrix.platform.target }}-${{ hashFiles('**/Cargo.lock') }}-${{ hashFiles('src/**/*.rs', 'xazz-*/src/**/*.rs') }}
          restore-keys: |
            build-${{ matrix.platform.target }}-${{ hashFiles('**/Cargo.lock') }}-
            build-${{ matrix.platform.target }}-

      - name: Build xazz
        run: cargo build --release -p xazz --target ${{ matrix.platform.target }}

      - name: Build xazz-runner
        run: cargo build --release -p xazz-runner --target ${{ matrix.platform.target }}

      - name: Build xazz-exec
        run: cargo build --release -p xazz-exec --target ${{ matrix.platform.target }}

      - name: Build xazz-server
        run: cargo build --release -p xazz-server --target ${{ matrix.platform.target }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: visual-ide/package-lock.json

      - name: Build Visual IDE (frontend)
        shell: bash
        working-directory: visual-ide
        run: |
          npm ci
          npm run build

      - name: Stage and package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          
          $version  = "${{ github.ref_name }}"
          $platform = "${{ matrix.platform.name }}"
          $target   = "${{ matrix.platform.target }}"
          $dist     = "dist\xazz"
          $out      = "xazz-${version}-${platform}.zip"

          New-Item -ItemType Directory -Force -Path $dist | Out-Null

          $binaries = Get-ChildItem "target\${target}\release" -Filter "*.exe" |
            Where-Object { $_.Name -match '^xazz' }

          if ($binaries.Count -eq 0) {
            Write-Error "ERROR: No binaries found for Windows packaging."
            exit 1
          }

          foreach ($binary in $binaries) {
            Copy-Item $binary.FullName -Destination $dist
          }

          if (Test-Path "examples") { Copy-Item -Recurse "examples" "$dist\examples" }
          if (Test-Path "config")   { Copy-Item -Recurse "config"   "$dist\config"   }
          if (Test-Path "visual-ide\dist") { Copy-Item -Recurse "visual-ide\dist" "$dist\web" }

          Compress-Archive -Path "dist\xazz" -DestinationPath $out
          "ARCHIVE=${out}" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Stage and package (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ github.ref_name }}"
          PLATFORM="${{ matrix.platform.name }}"
          TARGET="${{ matrix.platform.target }}"
          DIST="dist/xazz"
          OUT="xazz-${VERSION}-${PLATFORM}.tar.gz"

          mkdir -p "${DIST}"

          binaries=$(find "target/${TARGET}/release" -maxdepth 1 -type f -name 'xazz*' \
            ! -name '*.d' ! -name '*.rlib' ! -name '*.rmeta')

          if [ -z "$binaries" ]; then
            echo "ERROR: No binaries found for Unix packaging."
            exit 1
          fi

          for binary in $binaries; do
            cp "$binary" "${DIST}/"
          done

          [ -d examples ] && cp -r examples "${DIST}/examples"
          [ -d config   ] && cp -r config   "${DIST}/config"
          [ -d visual-ide/dist ] && cp -r visual-ide/dist "${DIST}/web"

          tar -czf "${OUT}" -C dist xazz
          echo "ARCHIVE=${OUT}" >> "$GITHUB_ENV"

      - name: Validate archive exists
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=( xazz-* )
          if [ ${#files[@]} -eq 0 ]; then
            echo "ERROR: no archive produced"
            exit 1
          fi
          echo "Archive ready: ${files[*]}"

      - name: Upload archive artifact
        uses: actions/upload-artifact@v7
        with:
          name: archive-${{ matrix.platform.name }}
          path: ${{ env.ARCHIVE }}
          retention-days: 1
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download archives
        uses: actions/download-artifact@v8
        with:
          pattern: archive-*
          merge-multiple: true
          path: release/

      - name: Validate artifacts
        shell: bash
        run: |
          set -euo pipefail
          echo "── release/ contents ──────────────────────────"
          ls -lh release/

          shopt -s nullglob
          archives=( release/xazz-* )

          if [ ${#archives[@]} -ne 3 ]; then
            echo "ERROR: expected 3 archives, found ${#archives[@]}"
            exit 1
          fi

          for f in "${archives[@]}"; do
            if [[ ! "$f" =~ ^release/xazz-.* ]]; then
              echo "ERROR: Unexpected archive name: $f"
              exit 1
            fi
            echo "OK: $f"
          done

      - name: Generate checksums
        shell: bash
        run: |
          cd release
          sha256sum * > checksums.sha256
          echo "── checksums ──────────────────────────────────"
          cat checksums.sha256

      - name: Generate release notes
        shell: bash
        run: |
          VERSION="${{ github.ref_name }}"
          PREV=$(git tag --sort=-version:refname \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
            | grep -v "^${VERSION}$" \
            | head -1 || true)

          {
            echo "## What's Changed"
            echo ""
            if [ -n "${PREV}" ]; then
              git log --pretty=format:"- %s (%h)" "${PREV}..HEAD"
            else
              git log --pretty=format:"- %s (%h)" HEAD
            fi
            echo ""
            echo ""
            echo "---"
            echo ""
            echo "## Included Binaries"
            echo ""
            echo "| Binary | Role |"
            echo "|--------|------|"
            echo "| \`xazz\` | CLI entry point |"
            echo "| \`xazz-runner\` | IPC bridge |"
            echo "| \`xazz-exec\` | Polars-powered runtime engine |"
            echo "| \`xazz-server\` | API + bundled Visual IDE server |"
            echo ""
            echo "## Visual IDE (bundled)"
            echo ""
            echo "A prebuilt Visual IDE ships in \`web/\`. Start the server and open"
            echo "\`http://127.0.0.1:8005\` in your browser:"
            echo ""
            echo "    ./xazz-server"
            echo ""
            echo "## Container image (GHCR)"
            echo ""
            echo "Multi-arch (\`linux/amd64\`, \`linux/arm64\`) images are published from this release:"
            echo ""
            echo "    docker pull ghcr.io/x1zzdev/xazz:${VERSION#v}"
            echo "    docker run --rm -p 8005:8005 -v \"\$PWD/data:/data\" ghcr.io/x1zzdev/xazz:${VERSION#v}"
            echo ""
            echo "Ports, volumes and uid permissions: \`docs/DOCKER.md\`."
            echo ""
            echo "## Installation"
            echo ""
            echo "1. Download the archive for your platform"
            echo "2. Extract — all binaries and the IDE land in \`xazz/\`"
            echo "3. Add \`xazz/\` to your \`PATH\`"
            echo "4. Run \`xazz --help\`"
            echo ""
            echo "> ⚠️ All three binaries must remain in the same directory."
          } > release_notes.md

      - name: Create GitHub Release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ github.ref_name }}"

          PRERELEASE=""
          echo "${VERSION}" | grep -q '-' && PRERELEASE="--prerelease"

          shopt -s nullglob
          archives=( release/*.zip release/*.tar.gz )

          if [ ${#archives[@]} -eq 0 ]; then
            echo "ERROR: no artifacts to release"
            exit 1
          fi

          gh release create "${VERSION}" \
            --title "Xazz ${VERSION}" \
            --notes-file release_notes.md \
            ${PRERELEASE} \
            "${archives[@]}" \
            release/checksums.sha256

  docker:
    name: Publish container image · GHCR
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
