  <rect x="706" y="150" width="508" height="62" rx="10" fill="#ffffff" stroke="#86efac"/>
  <text x="726" y="190" font-size="17" font-weight="700" fill="#111827">정적 타입 · Option&lt;T&gt; 검사</text>
  <line x1="960" y1="212" x2="960" y2="238" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#a2k)"/>

