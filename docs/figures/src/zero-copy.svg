<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="440" viewBox="0 0 1280 440" font-family="Inter, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <marker id="zc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect width="1280" height="440" fill="#ffffff"/>
  <rect x="0" y="0" width="1280" height="6" fill="#1e3a5f"/>
  <text x="36" y="46" font-size="26" font-weight="800" fill="#0f172a">Direct buffer tensor handoff</text>
  <text x="36" y="70" font-size="13.5" fill="#64748b">Arrow buffers flow straight into Burn tensors — no serialization wall between preprocessing and training.</text>

  <!-- Python path -->
  <rect x="36" y="100" width="1208" height="130" rx="14" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="56" y="130" font-size="13" font-weight="700" fill="#64748b">PYTHON · pandas → PyTorch</text>
  <rect x="56" y="146" width="240" height="56" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="176" y="170" font-size="14" font-weight="800" fill="#0f172a" text-anchor="middle">pandas DataFrame</text>
  <text x="176" y="188" font-size="11" fill="#94a3b8" text-anchor="middle">block-managed heap</text>
  <line x1="296" y1="174" x2="352" y2="174" stroke="#b91c1c" stroke-width="2.5" marker-end="url(#zc)"/>
  <text x="324" y="160" font-size="11.5" font-weight="700" fill="#b91c1c" text-anchor="middle">copy ①</text>
  <rect x="356" y="146" width="240" height="56" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="476" y="170" font-size="14" font-weight="800" fill="#0f172a" text-anchor="middle">NumPy array</text>
  <text x="476" y="188" font-size="11" fill="#94a3b8" text-anchor="middle">.values → dtype cast</text>
  <line x1="596" y1="174" x2="652" y2="174" stroke="#b91c1c" stroke-width="2.5" marker-end="url(#zc)"/>
  <text x="624" y="160" font-size="11.5" font-weight="700" fill="#b91c1c" text-anchor="middle">copy ②</text>
  <rect x="656" y="146" width="240" height="56" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="776" y="170" font-size="14" font-weight="800" fill="#0f172a" text-anchor="middle">torch.tensor(...)</text>
  <text x="776" y="188" font-size="11" fill="#94a3b8" text-anchor="middle">CPU → GPU transfer</text>
  <line x1="896" y1="174" x2="952" y2="174" stroke="#b91c1c" stroke-width="2.5" marker-end="url(#zc)"/>
  <text x="924" y="160" font-size="11.5" font-weight="700" fill="#b91c1c" text-anchor="middle">copy ③</text>
  <rect x="956" y="146" width="240" height="56" rx="10" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="1076" y="170" font-size="14" font-weight="800" fill="#b91c1c" text-anchor="middle">GPU tensor</text>
  <text x="1076" y="188" font-size="11" fill="#ef4444" text-anchor="middle">3 materializations · 2 language walls</text>

  <!-- Xazz path -->
  <rect x="36" y="258" width="1208" height="130" rx="14" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="56" y="288" font-size="13" font-weight="700" fill="#166534">XAZZ · Polars → Burn</text>
  <rect x="56" y="304" width="240" height="56" rx="10" fill="#ffffff" stroke="#86efac"/>
  <text x="176" y="328" font-size="14" font-weight="800" fill="#0f172a" text-anchor="middle">Polars DataFrame</text>
  <text x="176" y="346" font-size="11" fill="#94a3b8" text-anchor="middle">Apache Arrow columnar buffer</text>
  <line x1="296" y1="332" x2="652" y2="332" stroke="#166534" stroke-width="2.5" marker-end="url(#zc)"/>
  <text x="474" y="318" font-size="11.5" font-weight="700" fill="#166534" text-anchor="middle">shared Arrow buffer — explicit copy boundaries</text>
  <rect x="656" y="304" width="240" height="56" rx="10" fill="#ffffff" stroke="#86efac"/>
  <text x="776" y="328" font-size="14" font-weight="800" fill="#0f172a" text-anchor="middle">Burn Tensor</text>
  <text x="776" y="346" font-size="11" fill="#94a3b8" text-anchor="middle">TensorData::from_bytes</text>
  <line x1="896" y1="332" x2="952" y2="332" stroke="#166534" stroke-width="2.5" marker-end="url(#zc)"/>
  <rect x="956" y="304" width="240" height="56" rx="10" fill="#f0fdf4" stroke="#4ade80"/>
  <text x="1076" y="328" font-size="14" font-weight="800" fill="#166534" text-anchor="middle">Training ready</text>
  <text x="1076" y="346" font-size="11" fill="#22c55e" text-anchor="middle">no serialization · no FFI boundary</text>

  <text x="36" y="422" font-size="12.5" fill="#475569">One Rust process owns the whole pipeline: the Arrow buffers Polars produces are consumed directly as Burn tensors.</text>
</svg>
